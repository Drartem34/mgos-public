# ── Автозапуск ────────────────────────────────────────────────
exec-once = waybar -c ~/.config/waybar/kiosk.jsonc -s ~/.config/waybar/kiosk.css
# exec-once = ~/.config/hyprland/kiosk-dock/start-dock.sh
exec-once = /home/doki/.config/hyprland/kioskOS/runner/start-runner.sh
exec-once = /home/doki/.local/bin/carpeted
exec-once = firefox
# ── Змінні середовища для нативного Wayland та плавного скролу ───
env = MOZ_ENABLE_WAYLAND, 1
env = MOZ_USE_XINPUT2, 1
env = GDK_BACKEND, wayland,x11
env = QT_QPA_PLATFORM, wayland;xcb
env = CLUTTER_BACKEND, wayland
env = ELECTRON_OZONE_PLATFORM_HINT, auto
env = GSK_RENDERER, gl


# Шпалери вимкнено для економії ОЗУ та відеопам'яті (чорний фон малюється нативно)
# exec-once = swaybg -m fill -i /home/doki/Pictures/wallpapers/Microsoft_1987.jpg

# ── Дисплеї ───────────────────────────────────────────────────
monitor = eDP-1, 1920x1080@60, auto, 1
monitor = HDMI-1, highres, auto, 1

$mod = SUPER
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# ── БАЗОВЕ КЕРУВАННЯ ──────────────────────────────────────────
bind = $mod, Q, exec, ~/.config/hyprland/safe-close.sh
bind = $mod SHIFT, Q, killactive
bind = $mod, F, fullscreen # Розгорнути на весь екран
bind = $mod, P, exec, hyprctl dispatch exit
bind = $mod, Tab, exec, env GSK_RENDERER=gl nautilus --new-window
# Spotlight Runner (SUPER + SPACE або жест 3 пальцями)
bind = $mod, SPACE, exec, /home/doki/.config/hyprland/kioskOS/runner/runner --toggle
bind = ALT, SPACE, exec, wofi --conf ~/.config/hyprland/kioskOS/wofi.conf --style ~/.config/hyprland/kioskOS/wofi.css

# Миттєве вимкнення екрана для економії батареї
bind = $mod, F1, exec, hyprctl dispatch dpms off

# ── ШВИДКИЙ ЗАПУСК ────────────────────────────────────────────
bind = $mod, B, exec, firefox
bind = $mod, C, exec, code
bind = $mod, T, exec, kitty
bind = $mod, R, exec, /home/doki/.local/bin/carpeted toggle
bind = $mod SHIFT, R, exec, /home/doki/.local/bin/carpeted stash-window
bind = CTRL_SHIFT, ESCAPE, exec, kitty -e btop

# ── РОБОЧІ СТОЛИ ТА ФОКУС ─────────────────────────────────────
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = ALT, Tab, cyclenext
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

binde = SUPER SHIFT, left, movewindow, l
binde = SUPER SHIFT, right, movewindow, r
binde = SUPER SHIFT, up, movewindow, u
binde = SUPER SHIFT, down, movewindow, d

binde = SUPER CTRL, left, resizeactive, -40 0
binde = SUPER CTRL, right, resizeactive, 40 0
binde = SUPER CTRL, up, resizeactive, 0 -40
binde = SUPER CTRL, down, resizeactive, 0 40

# ── Mouse Binds ────────────────────────────────────────────────
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
bind  = SUPER, mouse:274, killactive 


# ── МУЛЬТИМЕДІА ТА СИСТЕМА ────────────────────────────────────
# Перемикання режиму живлення / продуктивності (економ -> баланс -> продуктивний)
bind = $mod, F4, exec, ~/.config/hyprland/toggle-mode.sh
# Скріншот виділеної області (grim + slurp + копіювання в буфер)
# bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
bind = SUPER+SHIFT, S, exec, sh -c 'hyprpicker -r -z & pid=$!; sleep 0.2; grim -g "$(slurp -d)" - | wl-copy; kill $pid || true'

# ── Media & Volume ─────────────────────────────────────────────
bind = SHIFT, F8, exec, playerctl next && ~/.config/dunst/music_notify.sh 
bind = SHIFT, F7, exec, playerctl previous && ~/.config/dunst/music_notify.sh 

# Гучність з плавною анімацією виїзду смужки із-за динаміка
bind = $mod, F8, exec, /home/doki/.config/waybar/volume.py up
bind = $mod, F7, exec, /home/doki/.config/waybar/volume.py down
bind = $mod, F10, exec, playerctl play-pause

# Яскравість
bind = $mod, F3, exec, brightnessctl s 5%+
bind = $mod, F2, exec, brightnessctl s 5%-
bind = $mod SHIFT, F3, exec, brightnessctl s 1%+
bind = $mod SHIFT, F2, exec, brightnessctl s 1%-

# Мультимедіа клавіші
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindle = , XF86AudioRaiseVolume, exec, /home/doki/.config/waybar/volume.py up
bindle = , XF86AudioLowerVolume, exec, /home/doki/.config/waybar/volume.py down
bindl = , XF86AudioMute, exec, /home/doki/.config/waybar/volume.py mute

# ── ОПТИМІЗАЦІЯ ДЛЯ МАКСИМАЛЬНОЇ АВТОНОМНОСТІ ─────────────────
animations {
    enabled = false
}

decoration {
    rounding = 0
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0
}

# Прямий вивід на дисплей повноекранних вікон (відео, браузер) в обхід композитора
render {
    direct_scanout = 0
}

# Апаратний курсор та автоприховування через 5 секунд спокою
cursor {
    no_hardware_cursors = true
    inactive_timeout = 0
}

# Нативне енергозбереження та мінімізація фонових процесів
misc {
    vfr = false
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = 0x000000
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    disable_autoreload = true
}

input {
    kb_layout = us,ua
    kb_options = grp:alt_shift_toggle
}

dwindle {
    preserve_split = true
}

# ── ПІДКЛЮЧЕННЯ КЕРУВАННЯ ТАЧПАДОМ ТА ЖЕСТАМИ ───────────────────
source = ~/.config/hyprland/touchpad.conf

