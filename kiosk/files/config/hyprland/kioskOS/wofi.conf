# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  kioskOS — Конфігурація Wofi (Термінальний / Оптимізований)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# Режими: drun (програми) та run (команди)
mode=drun,run

# Термінал для консольних програм (згідно з kiosk.conf)
term=kitty

# Розміри та розташування (компактний чорний квадрат/прямокутник по центру)
width=560
height=420
location=center

# Термінальний prompt
prompt=> 

# Оптимізація та продуктивність
allow_images=true
image_size=22
hide_scroll=true
no_actions=true
insensitive=true
matching=contains
parse_search=true
gtk_dark=true
layer=top
close_on_focus_loss=true
normal_window=false
