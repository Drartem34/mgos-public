# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  kioskOS — Керування тачпадом, жестами та SmoothScroll
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Параметри тачпада та плавності прокручування ─────────────
input {
    # Чутливість та швидкість курсора (усуває повільне пересування)
    sensitivity = 0.25
    accel_profile = adaptive

    # Високоточний піксельний скролінг (0 = вимикає дискретну емуляцію для плавного ходу)
    emulate_discrete_scroll = 0

    touchpad {
        # Відзеркалення прокручування сторінок (реверс / класичне)
        natural_scroll = false

        # КРИТИЧНО ДЛЯ ПІНГУ: Вимкнено блокування тачпада під час друку (усуває 500-1000мс зависання)
        disable_while_typing = false

        # Клік легким дотиком (1 палець — ЛКМ, 2 пальці — ПКМ, 3 пальці — СКМ)
        tap-to-click = true

        # Чутливість та плавність прокручування (0.8 дає контрольований, м'який та шовковистий хід)
        scroll_factor = 0.8

        # Блокування перетягування
        drag_lock = false

        # Поведінка кліку пальцями
        clickfinger_behavior = false
    }
}

# ── Миттєва обробка скролу без затримок ────────────────────────
binds {
    scroll_event_delay = 0
}

# ── Жести тачпада ─────────────────────────────────────────────
# Листання робочих столів змахуванням трьома пальцями по горизонталі
gesture = 3, horizontal, workspace

# Відкрити / перемкнути Spotlight Runner змахуванням трьома пальцями вгору
gesture = 3, up, dispatcher, exec, /home/doki/.config/hyprland/kioskOS/runner/runner --toggle

# Згорнути Spotlight Runner змахуванням трьома пальцями вниз
gesture = 3, down, dispatcher, exec, /home/doki/.config/hyprland/kioskOS/runner/runner --hide

# ── Параметри жестів та чутливості доводки ─────────────────────
gestures {
    # Відстань у пікселях для повного перемикання робочого столу
    workspace_swipe_distance = 300

    # Відзеркалення напрямку перемикання робочих столів (реверс)
    workspace_swipe_invert = false

    # Поріг спрацювання доводки (достатньо 35% руху, щоб стіл довівся сам)
    workspace_swipe_cancel_ratio = 0.35

    # Мінімальна швидкість легкого змаху для примусової доводки
    workspace_swipe_min_speed_to_force = 15

    # Блокування випадкового відхилення по вертикалі під час змаху
    workspace_swipe_direction_lock = true
    workspace_swipe_direction_lock_threshold = 10

    # Створювати новий робочий стіл при свайпі на останньому
    workspace_swipe_create_new = true

    # Безперервне гортання через кілька робочих столів
    workspace_swipe_forever = true
}

# ── Плавна доводка та інерція робочих столів ──────────────────
animations {
    enabled = true

    # Плавна крива безьє для м'якого ковзання та гальмування (easeOutQuart)
    bezier = smoothOut, 0.16, 1, 0.3, 1

    # Плавна доводка ТІЛЬКИ для робочих столів (ковзання slide)
    animation = workspaces, 1, 3.5, smoothOut, slide

    # Усі інші анімації залишаємо вимкненими (0) для економії ресурсів кіоску
    animation = windows, 0
    animation = fade, 0
    animation = layers, 0
    animation = border, 0
}
