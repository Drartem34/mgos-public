# Kitty для kiosk — власна темна тема, НЕ залежить від pywal/mgOS.
# Підключається через env KITTY_CONFIG_DIRECTORY у ~/.config/hyprland/kiosk.conf
font_family      jetbrains mono nerd font
font_size        9
bold_font        auto
italic_font      auto
bold_italic_font auto
mouse_hide_wait  2.0
cursor_shape     block
cursor_blink_interval 0
url_style        dotted
confirm_os_window_close 0
background_opacity 0.94
window_padding_width 4

foreground            #c9ccd1
background            #0c0d0f
selection_foreground  #0c0d0f
selection_background  #8a9099
cursor                #c9ccd1
cursor_text_color     #0c0d0f
url_color             #7aa2c7

active_tab_foreground   #0c0d0f
active_tab_background   #8a9099
inactive_tab_foreground #8a9099
inactive_tab_background #16181b
tab_bar_background      #0c0d0f

active_border_color   #8a9099
inactive_border_color #16181b
bell_border_color     #c77a7a

color0  #16181b
color8  #4a4f57
color1  #c77a7a
color9  #d99090
color2  #8fb38a
color10 #a3c79e
color3  #c9b27a
color11 #dbc690
color4  #7aa2c7
color12 #92b6d8
color5  #a98fc0
color13 #bca5d1
color6  #7ab8b5
color14 #92cbc8
color7  #b5b9bf
color15 #e2e4e7
