# ============================================================
# mpv.conf — Megumin OS
# ============================================================
# Глобальний профіль для звичайного перегляду відео
# Шейдери для ШПАЛЕР керуються окремо через профіль [wallpaper]
# ============================================================

profile=gpu-hq

# Шейдери для ЗВИЧАЙНОГО перегляду відео (важчі VL — OK для разового запуску)
glsl-shaders="~~/shaders/Anime4K_Restore_CNN_VL.glsl"
glsl-shaders-append="~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl"
glsl-shaders-append="~~/shaders/Anime4K_Restore_CNN_M.glsl"

# ============================================================
# Профіль для відео-шпалер (mpvpaper --profile=wallpaper)
#
# Ланцюжок "Mode A" від Anime4K — розумний апскейл:
#   1. Clamp_Highlights      → прибирає ореоли/пересвіт до апскейлу
#   2. Restore_CNN_Soft_M    → деблюр/відновлення деталей (1-й прохід)
#   3. Upscale_CNN_x2_M      → x2 апскейл (для мильних/піксельних шпалер)
#   4. AutoDownscalePre_x2   → якщо відео вже ≥ 2× роздільної здатності екрану
#   5. AutoDownscalePre_x4   →   — автоматично скасовує зайвий апскейл
#   6. Restore_CNN_Soft_M    → чистить артефакти після апскейлу (2-й прохід)
#
# Результат:
#   • 1080p шпалера на 4K екрані  → апскейл 2× + деблюр ✅ (помітна різниця)
#   • 4K шпалера на 4K екрані     → тільки деблюр, без зайвого апскейлу ✅
#   • Мильне відео               → Restore розм'якшує/гострить ✅
#   • Піксельне відео            → Upscale згладжує пікселі ✅
# ============================================================
[wallpaper]
glsl-shaders="~~/shaders/Anime4K_Clamp_Highlights.glsl"
glsl-shaders-append="~~/shaders/Anime4K_Restore_CNN_Soft_M.glsl"
glsl-shaders-append="~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"
glsl-shaders-append="~~/shaders/Anime4K_AutoDownscalePre_x2.glsl"
glsl-shaders-append="~~/shaders/Anime4K_AutoDownscalePre_x4.glsl"
glsl-shaders-append="~~/shaders/Anime4K_Restore_CNN_Soft_M.glsl"

# Обмеження FPS — шпалери не потребують більше 30fps
vf=fps=30

# Мінімальний буфер RAM
cache=no
demuxer-max-bytes=512KiB
demuxer-max-back-bytes=128KiB

# GPU декодування (RTX 3060 — nvdec)
hwdec=nvdec

# Менше проміжних буферів у рендерері
video-latency-hacks=yes
