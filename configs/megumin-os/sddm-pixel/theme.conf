[General]
; Ці значення — типові. Налаштування mgOS («Екран входу») пишуть свої в theme.conf.user.
; фон: wallpaper — шпалери системи, pixel — піксельні шпалери, waves — живі піксельні хвилі
Background=Backgrounds/wallpaper.jpg
BackgroundMode=wallpaper
PixelSize=6
Dim=25
Blur=false
Accent=#9929CF
; ClockStyle і PixelAvatar лишились від піксельної теми (v1) — тема v2 їх ігнорує
ClockStyle=wave
Clock24=true
ShowSeconds=false
PixelAvatar=false
