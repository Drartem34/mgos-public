# ━━ mgOS: автоналаштування під це залізо ━━━━━━━━━━━━━━━━━━━━━━━━
# Створено інсталятором 2026-11-21 19:49 (профіль mgos). При перевстановленні
# файл пишеться заново. Свій масштаб екрана — у ~/.config/mgos/display.conf, напр.:
#     eDP-1  1.5        або   Samsung  1   2560x1440@144
# Перевірити, що вибрано: mgos-display detect

# ── Екрани: масштаб за щільністю пікселів, рідна роздільність ──
# HDMI-A-1 · Samsung Electric Company Smart M80D H1AK500000 · 3840x2160 · 31.5" · 140 ppi → 2880x1620
monitor = HDMI-A-1, 3840x2160@60, auto, 1.333333
# будь-який інший екран: поки mgos-display watch його не підхопить
monitor = , preferred, auto, auto
# нові монітори (HDMI, док-станція) — масштаб підбирається сам при підключенні
exec-once = /usr/local/bin/mgos-display watch --profile mgos

# ── Інсталятор (~/.local/share/mgos/installer → тека репозиторію mgos) ──
# перший вхід після встановлення — вікно «Все готово до роботи» (один раз)
exec-once = ~/.local/share/mgos/installer/gui/welcome.sh
# сповіщення «Є нова версія mgOS» (GitHub; вимкнути: touch ~/.config/mgos/no-update-notify)
exec-once = ~/.local/share/mgos/installer/gui/update-notify.sh --loop

# ── Клавіатура ──
input {
    numlock_by_default = true    # ПК без батареї — NumLock увімкнено
}

source = ~/.config/hypr/touchpad-user.conf    # «Налаштування» → Трекпад / Клавіатура / Курсор
