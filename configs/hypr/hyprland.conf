# Підключаємо анімації
# source = ~/.config/hypr/animations.hl
source = /home/doki/.config/hypr/animations.hl

source = /home/doki/.cache/wal/colors-hyprland.conf



# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  MONITORS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

monitor = eDP-1, highrr, auto, 2
# monitor = HDMI-A-1, 3840x2160@60, 0x0, 1.5
# monitor = , 3840x2160@60, 0x0, 1.5
monitor = desc:Samsung Electric Company Smart M80D H1AK500000, 3840x2160@60, auto, 1.5

bind = ALT, SPACE, exec, ignis toggle-window launcher
; bind = SUPER, Z, exec, ignis toggle-window control_center
# bind = SUPER, O, exec, ignis toggle-window powermenu
# bind = SUPER, I, exec, ignis toggle-window about  # замінено на SYSui about_osd

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  VARIABLES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

$activeWindowBorderColour = rgba(fff1f1FF) rgba(fff1f1ff)
$inactiveWindowBorderColour = rgba(fff1f133) rgba(fff1f133)
$cursorTheme = Bibata-Modern-Classic
$cursorSize = 16
$windowRounding = 15
$windowBorderSize = 2

$notifycmd = dunstify
$term = wezterm
$filemanagertui = $term -e fish -c yy
$screenshot = hyprshot --clipboard-only -m
$colorpicker = hyprpicker
$browser = firefox


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  ENV (ENVIRONMENT VARIABLES)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

env = TERM, wezterm
env = EDITOR, micro
env = LIBSEAT_BACKEND, logind

# NVIDIA Specific
env = LIBVA_DRIVER_NAME, nvidia
env = GBM_BACKEND, nvidia-drm
# env = __GLX_VENDOR_LIBRARY_NAME, nvidia
env = WLR_NO_HARDWARE_CURSORS, 1

# NVIDIA Specific
# env = __GLX_VENDOR_LIBRARY_NAME,nvidia  
env = NVD_BACKEND,direct             
env = MOZ_ENABLE_WAYLAND,1

# Wayland
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland
env = USE_WAYLAND_GRIM, 1
env = GDK_BACKEND, wayland,x11
env = SDL_VIDEODRIVER, wayland,x11,windows
env = CLUTTER_BACKEND, wayland
env = ELECTRON_OZONE_PLATFORM_HINT, auto

# Qt
env = QT_QPA_PLATFORM, wayland;xcb
env = QT_QPA_PLATFORMTHEME, qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1
env = QT_AUTO_SCREEN_SCALE_FACTOR, 1

# Misc
env = _JAVA_AWT_WM_NONREPARENTING, 1
env = MOZ_ENABLE_WAYLAND, 1

# Cursor
env = XCURSOR_THEME, $cursorTheme
env = XCURSOR_SIZE, $cursorSize
env = HYPRCURSOR_THEME, $cursorTheme
env = HYPRCURSOR_SIZE, $cursorSize

exec = gsettings set $GNOME_SCHEMA font-name 'SF-Pro-Text-Bold'


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  INPUT
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

input {
    kb_layout = us,ua
    kb_options = grp:alt_shift_toggle
    numlock_by_default = false
    repeat_delay = 250
    repeat_rate = 35

    focus_on_close = 1
    follow_mouse = 1
    accel_profile = flat
    sensitivity = 0.3 

    touchpad {
        natural_scroll = true
        disable_while_typing = true
        scroll_factor = 0.8 
    }
}

binds {
    scroll_event_delay = 0
}

cursor {
    hotspot_padding = 1
}

xwayland {
    force_zero_scaling = true
}


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  GENERAL
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

general {
    layout = dwindle
    allow_tearing = false #вертикальна синхронізація

    gaps_workspaces = 0
    gaps_in         = 3
    gaps_out        = 5, 10, 10, 10
    
    border_size     = 3

    # Використовуємо динамічні кольори з Pywal
    col.active_border = $color1 $color6 45deg
    col.inactive_border = rgba(595959aa)
}

# general {
#     layout = dwindle
#     allow_tearing = false

#     gaps_workspaces = 0
#     gaps_in         = 3
#     gaps_out        = 5, 10, 10, 10
#     border_size     = $windowBorderSize

#     col.active_border   = $activeWindowBorderColour
#     col.inactive_border = $inactiveWindowBorderColour
# }

dwindle {
    preserve_split = true
    smart_split = false
    smart_resizing = true
    special_scale_factor = 0.9 
}


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  DECORATION
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

decoration {
    rounding = $windowRounding

    blur {
        enabled           = true
        xray              = false
        special           = true
        ignore_opacity    = true 
        new_optimizations = true
        popups            = true
        input_methods     = true
        size              = 5
        passes            = 4
    }

    shadow {
        enabled      = true
        range        = 10
        render_power = 5
        color        = rgba(0b1215e8)
    }
    
    dim_inactive = true
    dim_strength = 0.2
    dim_special  = 0.5
}

# ── Layer Rules ────────────────────────────────────────────────
layerrule = blur on, match:namespace waybar
layerrule = blur on, ignore_alpha 0, match:namespace ignis_wallpapers
layerrule = blur on, ignore_alpha 0, match:namespace ignis_dock
layerrule = blur on, ignore_alpha 0, match:namespace ignis_powermenu
layerrule = blur on, ignore_alpha 0, match:namespace ignis_about
layerrule = blur on, ignore_alpha 0, match:namespace ignis_switcher
layerrule = blur on, ignore_alpha 0, match:namespace ignis_launcher
layerrule = blur on, ignore_alpha 0.5, match:namespace ignis
layerrule = blur on, ignore_alpha 0, match:namespace ignis_clipboard


layerrule = blur on, ignore_alpha 0.5, match:namespace dock
layerrule = blur on, ignore_alpha 0.5, match:namespace wallpapers 
layerrule = blur on, ignore_alpha 0.1, match:namespace megumin_osd
layerrule = blur on, ignore_alpha 0.1, match:namespace volume_osd
layerrule = blur on, ignore_alpha 0.1, match:namespace notify_osd
layerrule = blur on, ignore_alpha 0.1, match:namespace powermenu
layerrule = blur on, ignore_alpha 0.1, match:namespace clipboard
layerrule = blur on, ignore_alpha 0.1, match:namespace topbar
layerrule = blur on, ignore_alpha 0, match:namespace runner
layerrule = blur on, ignore_alpha 0.1, match:namespace control_center




# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  MISC & GROUPS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

misc {
    # vfr = true
    vrr = 0
    animate_manual_resizes = false
    animate_mouse_windowdragging = false
    disable_hyprland_logo = true
    force_default_wallpaper = 0
    allow_session_lock_restore = true
    middle_click_paste = false
    focus_on_activate = true
    session_lock_xray = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    background_color = rgb(0a0a21) 
}

debug {
    vfr = true
    error_position = 1
}

group {
    col.border_active = $color4 $color6 45deg
    col.border_inactive = $color0
    col.border_locked_active = $color4
    col.border_locked_inactive = $color0

    groupbar {
        font_family = JetBrains Mono NF
        font_size = 15
        gradients = true
        gradient_round_only_edges = false
        gradient_rounding = 5
        height = 25
        indicator_height = 0
        gaps_in = 3
        gaps_out = 3

        text_color = $color15
        col.active = $color2
        col.inactive = $color0
        col.locked_active = $color2
        col.locked_inactive = $color0
    }
}


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  STARTUP (EXEC-ONCE)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── System / Env ───────────────────────────────────────────────
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/local/bin/cleanup-cache.sh
exec-once = rclone mount drive: ~/GoogleDrive --vfs-cache-mode full --allow-non-empty

# ── UI & Daemons ───────────────────────────────────────────────
exec-once = swaybg -c "#0a0a21"
exec-once = swww-daemon
exec-once = swww init
# exec-once = waybar
exec-once = dunst
exec-once = ignis init
exec-once = walker --gapplication-service
exec-once = wlsunset -L 30.523333 -l 50.450001 -t 5000
exec-once = libinput-gestures &
exec-once = mpvpaper
exec-once = wl-paste --type text --watch cliphist store 
exec-once = wl-paste --type image --watch cliphist store
exec-once = wl-paste --watch cliphist store


# ── UI & C++ ───────────────────────────────────────────────
exec-once = /home/doki/.config/SYSui/volume_osd
exec-once = /home/doki/.config/SYSui/megumin_osd
exec-once = /home/doki/.config/SYSui/notify_osd
exec-once = /home/doki/.config/SYSui/dock
exec-once = /home/doki/.config/SYSui/powermenu_osd
exec-once = /home/doki/.config/SYSui/clipboard_osd
exec-once = /home/doki/.config/SYSui/topbar
exec-once = /home/doki/.config/SYSui/runner_osd
exec-once = /home/doki/.config/SYSui/controller_addon
exec-once = bash /home/doki/.config/SYSui/wallpapers_watch.sh
exec-once = /home/doki/.config/SYSui/cc_osd
exec-once = /home/doki/.config/SYSui/about_osd

# ── Dunst & Shell Scripts ──────────────────────────────────────
exec-once = ~/.config/hypr/hyprlock_battery.sh &
exec-once = ~/.config/dunst/volume_notify.sh &
exec-once = ~/.config/dunst/brightness_notify.sh &
exec-once = ~/.config/dunst/batterynotify &
exec-once = ~/.config/dunst/batteryhibernate &
exec-once = ~/.config/dunst/screenshot &
exec-once = ~/wallpers/timeWALL.sh &
exec-once = ~/wallpers/low_battery.sh &

# ── QwikShell Web Server ───────────────────────────────────────
exec-once = [workspace 9 silent] kitty --class kitty-service -e sh -c "sleep 2 && cd /mnt/newdisk/SLOWSHELL && python3 start.py"

# ── Apps ───────────────────────────────────────────────────────
exec-once = spotify
exec-once = vesktop --start-minimized

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  KEYBINDS
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Core / System ──────────────────────────────────────────────
bind = SUPER, Q, killactive
bind = SUPER SHIFT, Q, exec, hyprctl kill
bind = SUPER, P, exec, hyprctl dispatch exit
bind = SUPER, F, fullscreen
bind = SUPER_ALT_CRL, F12, exec, /home/doki/.config/hypr/resurrect.sh
bind = SUPER, Y, exec, mpv "$(wl-paste)"
# bind = SUPER, S, togglesplit
bind = SUPER, S, layoutmsg, togglesplit
bind = SUPER, Space, exec, hyprctl dispatch togglefloating && hyprctl dispatch resizeactive exact 1000 600
bind = SUPER_SHIFT, F1, exec, ~/.config/hypr/scripts/toggle-power-save.sh
# bind = SUPER, L, exec, hyprlock

bind = SUPER, O, exec, echo "show" | socat - UNIX-CLIENT:/home/doki/.config/SYSui/powermenu.sock
bind = SUPER, V, exec, echo "toggle" | socat - UNIX-CONNECT:/home/doki/.config/SYSui/clipboard.sock
bind = SUPER, Z, exec, echo "toggle" | socat - UNIX-CLIENT:/home/doki/.config/SYSui/cc.sock
bind = ALT, Space, exec, echo "show" | socat - UNIX-CLIENT:/home/doki/.config/SYSui/runner.sock

bind = SUPER, F4, exec, kitty -e python /home/doki/QSH/SLOWSHELL/start.py

# ── Apps ───────────────────────────────────────────────────────
bind = SUPER, B, exec, $browser
bind = SUPER, K, exec, $term
bind = SUPER, T, exec, kitty --hold -e fastfetch
bind = CTRL SUPER, C, exec, kitty --class claude-chat --directory /home/doki -e /home/doki/.npm-global/bin/claude --model claude-opus-5-5
bind = SUPER, Tab, exec, nautilus 
bind = SUPER SHIFT, K, exec, cool-retro-term
bind = SUPER, E, exec, $filemanagertui
bind = SUPER SHIFT, E, exec, $filemanagertui
bind = CTRL_SHIFT, ESCAPE, exec, kitty -e btop
bind = CTRL_ALT, SPACE, exec, wofi

# ── Ignis / Custom UI ──────────────────────────────────────────
bind = SUPER, D, exec, dunstctl close-all
#bind = ALT, SPACE, exec, gdbus call --session --dest com.github.linkfrg.ignis --object-path /com/github/linkfrg/ignis --method org.gtk.Actions.Activate "toggle-launcher" [] {}
#bind = SUPER, V, exec, gdbus call --session --dest com.github.linkfrg.ignis --object-path /com/github/linkfrg/ignis --method org.gtk.Actions.Activate "toggle-clipboard" [] {}
# bind = SUPER, Z, exec, gdbus call --session --dest com.github.linkfrg.ignis --object-path /com/github/linkfrg/ignis --method org.gtk.Actions.Activate "toggle-control-center" [] {}
# bind = SUPER, O, exec, gdbus call --session --dest com.github.linkfrg.ignis --object-path /com/github/linkfrg/ignis --method org.gtk.Actions.Activate "toggle-powermenu" [] {}
bind = SUPER, I, exec, echo "toggle" | socat - UNIX-CLIENT:/home/doki/.config/SYSui/about.sock
bind = SUPER, U, exec, python3 ~/.config/ignis/settings.py
# bind = SUPER, U, exec, sh -c "pkill -f settings.py; python3 ~/.config/ignis/settings.py"
bind = SUPER, W, exec, echo "toggle" | socat - UNIX-CONNECT:/home/doki/.config/SYSui/wallpapers.sock
bind = ALT, W, exec, echo "toggle" | socat - UNIX-CONNECT:/home/doki/.config/SYSui/wallpapers.sock
# Ignis Window Switcher
bind = ALT, Tab, exec, gdbus call --session --dest com.github.linkfrg.ignis --object-path /com/github/linkfrg/ignis --method org.gtk.Actions.Activate "switcher-next" [] {}
bindrt = ALT, Alt_L, exec, gdbus call --session --dest com.github.linkfrg.ignis --object-path /com/github/linkfrg/ignis --method org.gtk.Actions.Activate "switcher-release" [] {}

# ── Screenshots & Utils ────────────────────────────────────────
# bind = SUPER+SHIFT, s, exec, sh -c 'grim -g "$(slurp -d)" - | wl-copy -t image/png'
bind = SUPER+SHIFT, s, exec, sh -c 'hyprpicker -r -z & pid=$!; sleep 0.2; grim -g "$(slurp -d)" - | wl-copy; kill $pid || true'
bind = ALT, f12, exec, grim ~/Pictures/screenshots/$(date +%Y-%m-%d_%H-%M-%S).png
bind = ALT, f12, exec, ~/.config/dunst/screenshot &
bind = SHIFT, Print, exec, grim - | wl-copy -t image/png
bind = ALT, fn, exec, flameshot gui
bind = SUPER SHIFT, X, exec, hyprpicker -a
bind = SUPER_SHIFT, I, exec, wezterm -e bluetuith

# ── Waybar & Wallpaper ─────────────────────────────────────────
bind = SUPER SHIFT, W, exec, killall waybar
bind = SUPER SHIFT, W, exec, waybar
bind = SUPER_SHIFT, Tab, exec, ~/wallpers/timeWALL.sh

# ── Media & Volume ─────────────────────────────────────────────
# bind = SUPER_SHIFT, F7, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 0% && ~/.config/dunst/volume_notify.sh
# bind = SUPER, F7, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && ~/.config/dunst/volume_notify.sh
# bind = SUPER, F8, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ && ~/.config/dunst/volume_notify.sh

bind = SUPER, F10, exec, ~/.config/hypr/scripts/media.sh play-pause && ~/.config/dunst/music_notify.sh
#bind = SHIFT, F8, exec, playerctl next && ~/.config/dunst/music_notify.sh 
#bind = SHIFT, F7, exec, playerctl previous && ~/.config/dunst/music_notify.sh 

# Музика
bind = SHIFT, F8, exec, ~/.config/hypr/scripts/media.sh next
bind = SHIFT, F7, exec, ~/.config/hypr/scripts/media.sh previous
bind = SHIFT, F9, exec, ~/.config/hypr/scripts/media.sh play-pause
# bind = SHIFT, F8, exec, playerctl next && killall -SIGUSR1 megumin_osd
# bind = SHIFT, F7, exec, playerctl previous && killall -SIGUSR1 megumin_osd
# bind = SHIFT, F9, exec, playerctl play-pause && killall -SIGUSR1 megumin_osd

# Гучність
# binde дозволяє затискати кнопку!
# binde = SUPER, F7, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && killall -SIGUSR2 volume_osd
# binde = SUPER, F8, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ && killall -SIGUSR2 volume_osd
# bind = SUPER_SHIFT, F7, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && killall -SIGUSR2 volume_osd

# Гучність (через сокети)
# binde дозволяє затискати кнопку!
binde = SUPER, F7, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && echo "show" | socat - UNIX-CLIENT:/home/doki/.config/SYSui/volume.sock
binde = SUPER, F8, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ && echo "show" | socat - UNIX-CLIENT:/home/doki/.config/SYSui/volume.sock
bind = SUPER_SHIFT, F7, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && echo "show" | socat - UNIX-CLIENT:/home/doki/.config/SYSui/volume.sock

bindl = , XF86AudioPlay, exec, ~/.config/hypr/scripts/media.sh play-pause
bindl = , XF86AudioNext, exec, ~/.config/hypr/scripts/media.sh next
bindl = , XF86AudioPrev, exec, ~/.config/hypr/scripts/media.sh previous
bindl = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ && echo "show" | socat - UNIX-CLIENT:/home/doki/.config/SYSui/volume.sock
bindl = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && echo "show" | socat - UNIX-CLIENT:/home/doki/.config/SYSui/volume.sock
# ── Brightness ─────────────────────────────────────────────────
bind = SUPER, F3, exec, brightnessctl set +5% && ~/.config/dunst/brightness_notify.sh
bind = SUPER, F2, exec, brightnessctl set 5%- && ~/.config/dunst/brightness_notify.sh
bind = SUPER, F2, exec, ddcutil setvcp 10 - 5 && ~/.config/dunst/brightness_notify.sh
bind = SUPER, F3, exec, ddcutil setvcp 10 + 5 && ~/.config/dunst/brightness_notify.sh

# ── Window Focus & Movement ────────────────────────────────────
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

binde = SUPER SHIFT, left, movewindow, l
binde = SUPER SHIFT, right, movewindow, r
binde = SUPER SHIFT, up, movewindow, u
binde = SUPER SHIFT, down, movewindow, d

binde = SUPER CTRL, left, resizeactive, -40 0
binde = SUPER CTRL, right, resizeactive, 40 0
binde = SUPER CTRL, up, resizeactive, 0 -40
binde = SUPER CTRL, down, resizeactive, 0 40

# ── Groups ─────────────────────────────────────────────────────
bind = SUPER, G, togglegroup
bind = SUPER, C, moveoutofgroup
bind = SUPER, X, changegroupactive

# ── Workspaces ─────────────────────────────────────────────────
bind = SUPER SHIFT, Space, workspaceopt, allfloat
bind = SUPER SHIFT, Space, exec, $notifycmd 'Toggled All Float Mode'

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10
bind = SUPER ALT, up, workspace, m+1
bind = SUPER ALT, down, workspace, m-1

bind = SUPER SHIFT, 1, movetoworkspacesilent, 1
bind = SUPER SHIFT, 2, movetoworkspacesilent, 2
bind = SUPER SHIFT, 3, movetoworkspacesilent, 3
bind = SUPER SHIFT, 4, movetoworkspacesilent, 4
bind = SUPER SHIFT, 5, movetoworkspacesilent, 5
bind = SUPER SHIFT, 6, movetoworkspacesilent, 6
bind = SUPER SHIFT, 7, movetoworkspacesilent, 7
bind = SUPER SHIFT, 8, movetoworkspacesilent, 8
bind = SUPER SHIFT, 9, movetoworkspacesilent, 9
bind = SUPER SHIFT, 0, movetoworkspacesilent, 10

# ── Mouse Binds ────────────────────────────────────────────────
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
bind  = SUPER, mouse:274, killactive 


# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  WINDOW RULES
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━


layerrule = blur on, ignore_alpha 0.5, match:namespace ignis_bar


# ── Floating & Centering ───────────────────────────────────────
windowrule = float on, match:class ^(org.kde.polkit-kde-authentication-agent-1)$
windowrule = float on, match:title ^(Media viewer)$
windowrule = float on, move (75) ((monitor_h*0.44)), match:title ^(Volume Control)$
windowrule = float on, match:class ^(dialog)$
windowrule = float on, center on, match:class ^(com.megumin.installer)$
windowrule = float on, match:class ^(download)$
windowrule = float on, match:class ^(notification)$
windowrule = float on, match:class ^(error)$
windowrule = float on, match:title ^(Open File)$
windowrule = float on, match:class (dolphin)
windowrule = float on, match:class (kate)
windowrule = float on, no_focus on, match:class ^(wofi)$

windowrule = center on, match:float 1

# ── Workspaces Binding ─────────────────────────────────────────
windowrule = workspace 2, match:class ^(vesktop)$
windowrule = workspace 2, match:class ^(org.telegram.desktop)$
windowrule = workspace 2, match:class ^(obsidian)$
windowrule = workspace 1, match:class ^(Spotify)$
windowrule = workspace 4, match:class (idea)
windowrule = workspace 4, match:class ^(Code)$
windowrule = workspace 5, match:class ^(obs)$
windowrule = workspace 10, match:class (keepassxc)

# ── Specific Hacks ─────────────────────────────────────────────
windowrule = no_initial_focus on, match:class ^(.*jetbrains.*)$, match:title ^(win.*)$
windowrule = move (cursor_x+(min(max(-(monitor_w*0.05)\,0)\,monitor_w-window_w))) (cursor_y+(min(max((monitor_h*0)\,0)\,monitor_h-window_h))), pin on, match:class ^(it.catboy.ripdrag)$

plugin {
    hyprwinwrap {
        class=mpv
    }
}

