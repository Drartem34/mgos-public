# ━━ mgOS: тачпад, клавіатура, курсор з «Налаштувань» (settings.py). Файл перезаписується. ━━
input {
    repeat_delay = 250
    repeat_rate = 35
    sensitivity = 0.3
    accel_profile = flat
    natural_scroll = false
    scroll_factor = 1.00
    left_handed = false
    touchpad {
        natural_scroll = false
        tap-to-click = true
        clickfinger_behavior = true
        tap-and-drag = true
        drag_lock = false
        disable_while_typing = false
        middle_button_emulation = true
        scroll_factor = 0.80
    }
}
gestures {
    workspace_swipe_invert = false
    workspace_swipe_distance = 300
    workspace_swipe_create_new = true
    workspace_swipe_forever = true
}
# Три пальці вниз: вікно в док (SYSui/dock_genie.h)
gesture = 3, down, unset
# Три пальці вгору: вікно на повний екран, коротко вниз — назад (SYSui/dock_genie.h)
gesture = 3, up, unset
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,21
env = HYPRCURSOR_SIZE,21
exec-once = hyprctl setcursor Bibata-Modern-Classic 21
