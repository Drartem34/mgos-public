# Hyprland живої флешки Megumin OS — мінімум: інсталятор на весь екран (шар BOTTOM),
# Firefox / термінал / диски відкриваються над ним.
monitor = , preferred, auto, auto
env = XCURSOR_SIZE, 24
exec-once = mgos-setup
exec-once = nm-applet --indicator

input {
    kb_layout = us,ua
    kb_options = grp:alt_shift_toggle
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}
general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    col.active_border = rgb(55d0f5)
    layout = dwindle
}
decoration {
    rounding = 12
}
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

$mod = SUPER
bind = $mod, Return, exec, kitty
bind = $mod, T, exec, kitty
bind = $mod, B, exec, firefox
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod SHIFT, I, exec, pgrep -x mgos-setup || mgos-setup
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
