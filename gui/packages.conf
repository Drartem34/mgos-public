# ============================================================================
#  Групи пакетів знімка Megumin OS (pkglist.txt = pacman -Qqe системи автора).
#  Кожен пакет знімка потрапляє в одну групу. Пакет, якого немає в жодній
#  групі (новий після sync), автоматично йде в [apps] — тож нічого не губиться.
#
#  [skip]       — НЕ ставиться: сміття, специфічне для EndeavourOS, базова система
#                 (на цільовому Arch вона вже своя), завантажувач/initramfs.
#  [utils]      — завжди: утиліти, без яких mgOS працює гірше (мініатюри, checkupdates…)
#  [apps]       — програми автора, вибираються в інсталяторі (усі увімкнені)
#  [dev]        — розробка, вибирається (вимкнено)
#  [hw:<умова>] — драйвери: ставляться лише якщо умова виконується на цьому ПК
#                 nvidia | nvidia-hybrid | intel-gpu | amd-gpu | amd-cpu | intel-cpu |
#                 sof | broadcom-wifi | laptop | board:<підрядок DMI board_name>
#                 lib32-* ставляться лише коли увімкнено multilib
# ============================================================================

[skip]
