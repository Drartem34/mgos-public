e2fsprogs btrfs-progs xfsprogs f2fs-tools jfsutils nilfs-utils dosfstools exfatprogs ntfs-3g mtools
netctl iwd wpa_supplicant modemmanager usb_modeswitch xl2tpd b43-fwcutter alsa-firmware
xorg-server xorg-xinit xorg-xdpyinfo xorg-xinput xorg-xkill xorg-xrandr xf86-input-libinput xterm
systemd-sysvcompat hwdetect sg3_utils lsscsi sysfsutils haveged ntp texinfo ex-vi-compat s-nail
