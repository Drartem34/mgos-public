[hw:amd-gpu]
mesa lib32-mesa vulkan-radeon lib32-vulkan-radeon

[hw:amd-cpu]
amd-ucode

[hw:intel-cpu]
intel-ucode

[hw:sof]
# звук ноутбуків Intel 2019+ (Sound Open Firmware): без цього — «Dummy Output», звуку немає
sof-firmware alsa-ucm-conf

[hw:broadcom-wifi]
broadcom-wl-dkms

[hw:laptop]
# яскравість екрана з клавіш/панелі, керування батареєю
