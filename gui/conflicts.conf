# ============================================================================
#  Дублі й конфлікти: дві програми на одну роль (стара + нова), які б'ються між собою
#  (два менеджери живлення, два сервери звуку, два демони сповіщень…).
#
#  Крок «dedupe» прибирає СТАРЕ лише коли НОВЕ вже є, і не видаляє пакет, від якого
#  залежить щось поза цим правилом. Усе пишеться в точку відкату — «Скасувати» поверне.
#
#  роль | умови | старі пакети (видалити) | старі служби (вимкнути) | служби нового (увімкнути)
#    умови (усі мають виконатись, через пробіл):
#      pkg:<пакет>  — встановлено          cmd:<команда> — є в PATH
#      svc:<юніт>   — увімкнено            nosvc:<юніт>  — НЕ увімкнено
#      -            — без умов
#    служби: user:<юніт> — служба користувача; unmask:<юніт> — зняти mask (якщо є)
# ============================================================================
Звук: PulseAudio → PipeWire     | pkg:pipewire-pulse | pulseaudio pulseaudio-alsa pulseaudio-bluetooth pulseaudio-jack pulseaudio-zeroconf pulseaudio-equalizer pulseaudio-lirc | user:pulseaudio.service user:pulseaudio.socket | user:pipewire-pulse.socket
JACK: jack2 → PipeWire          | pkg:pipewire-jack | jack2 jack | - | -
Сесія PipeWire: → WirePlumber   | pkg:wireplumber | pipewire-media-session | user:pipewire-media-session.service | user:wireplumber.service
Живлення: → power-profiles-daemon | pkg:power-profiles-daemon | tlp tlp-rdw auto-cpufreq laptop-mode-tools xfce4-power-manager | tlp.service auto-cpufreq.service laptop-mode.service | unmask:systemd-rfkill.service unmask:systemd-rfkill.socket power-profiles-daemon.service
Сповіщення: → dunst             | pkg:dunst | xfce4-notifyd mako swaync | user:mako.service user:swaync.service | -
Шпалери: swww → awww            | cmd:awww | swww | - | -
Час: ntpd → systemd-timesyncd   | nosvc:chronyd.service | ntp openntpd | ntpd.service openntpd.service | systemd-timesyncd.service
Мережа: → NetworkManager        | pkg:networkmanager svc:NetworkManager.service | netctl | dhcpcd.service systemd-networkd.service connman.service | -
Портал: wlr → Hyprland          | pkg:xdg-desktop-portal-hyprland | xdg-desktop-portal-wlr | - | -
