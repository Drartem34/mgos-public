<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- mgOS (публічна версія): шрифтів Apple SF немає — підміняємо їх вільним Inter.
     Якщо SF Pro / SF Compact потім поставити в ~/.local/share/fonts, вони мають пріоритет. -->
<fontconfig>
  <alias binding="same"><family>SF Pro Display</family><accept><family>Inter</family></accept></alias>
  <alias binding="same"><family>SF Pro Text</family><accept><family>Inter</family></accept></alias>
  <alias binding="same"><family>SF Pro</family><accept><family>Inter</family></accept></alias>
  <alias binding="same"><family>SF-Pro-Text</family><accept><family>Inter</family></accept></alias>
  <alias binding="same"><family>SF-Pro-Display</family><accept><family>Inter</family></accept></alias>
  <alias binding="same"><family>SF Compact Display</family><accept><family>Inter</family></accept></alias>
  <alias binding="same"><family>SF Compact</family><accept><family>Inter</family></accept></alias>
  <alias binding="same"><family>.AppleSystemUIFont</family><accept><family>Inter</family></accept></alias>
</fontconfig>
