# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  mgOS — тачпад і жести (ті самі, що в kioskOS: kiosk/files/config/hyprland/touchpad.conf)
#  Ставить інсталятор (крок «Екран, масштаб, тачпад»), підключається з mgos-auto.conf.
#  Напрямок прокручування (natural_scroll) лишається таким, як у hyprland.conf mgOS.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Плавне прокручування ──────────────────────────────────────
input {
    # Високоточний піксельний скролінг (без дискретної емуляції — плавний хід)
    emulate_discrete_scroll = 0

    touchpad {
        # Без блокування тачпада під час друку (прибирає 500–1000 мс «зависання»)
        disable_while_typing = false
        # Клік дотиком: 1 палець — ЛКМ, 2 — ПКМ, 3 — СКМ
        tap-to-click = true
        # М'який контрольований хід
        scroll_factor = 0.8
        drag_lock = false
        clickfinger_behavior = false
    }
}
# Швидкість і прискорення курсора тачпада (sensitivity 0.25, adaptive) задаються в mgos-auto.conf
# окремо для кожного тачпада — миша лишається з налаштуваннями mgOS (flat).

binds {
    scroll_event_delay = 0
}

# ── Жести ─────────────────────────────────────────────────────
# Робочі столи — змах трьома пальцями по горизонталі (стіл їде за пальцями)
gesture = 3, horizontal, workspace
# Runner — три пальці вгору / вниз
gesture = 3, up, dispatcher, exec, echo toggle | socat - UNIX-CLIENT:@HOME@/.config/SYSui/runner.sock
gesture = 3, down, dispatcher, exec, echo hide | socat - UNIX-CLIENT:@HOME@/.config/SYSui/runner.sock

gestures {
    workspace_swipe_distance = 300
    workspace_swipe_invert = false
    # Достатньо 35% руху — стіл доводиться сам
    workspace_swipe_cancel_ratio = 0.35
    # Легкий швидкий змах теж перемикає
    workspace_swipe_min_speed_to_force = 15
    workspace_swipe_direction_lock = true
    workspace_swipe_direction_lock_threshold = 10
    workspace_swipe_create_new = true
    workspace_swipe_forever = true
}

# ── Плавна доводка робочих столів (як у kiosk) ────────────────
animations {
    bezier = smoothOut, 0.16, 1, 0.3, 1
    animation = workspaces, 1, 3.5, smoothOut, slide
}
